<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3udget katalog</title>
<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --border: #e2ddd3;
    --text: #2b2620;
    --muted: #8a8177;
    --accent: #2e7dd6;
    --accent2: #5a8f4f;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 100px;
  }
  header { padding: 20px 20px 12px; max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }
  .toolbar { display: flex; gap: 8px; max-width: 720px; margin: 0 auto 8px; padding: 0 20px; }
  input[type=text], input[type=search], input[type=number], select {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    width: 100%;
  }
  .btn {
    font: inherit;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid transparent; }
  .btn-danger:hover { background: #fbeae8; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; }

  main { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .entry-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    object-fit: contain;
    background: var(--bg);
    flex-shrink: 0;
  }
  .entry-title { font-weight: 700; font-size: 1.05rem; }
  .entry-sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .badge {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 3px 8px; border-radius: 999px; margin-left: 8px;
  }
  .badge-income { background: #e4f3e0; color: var(--accent2); }
  .badge-expense { background: #eee; color: var(--muted); }
  .chevron { color: var(--muted); transition: transform 0.15s; font-size: 0.85rem; margin-left: auto; }
  .entry.open .chevron { transform: rotate(90deg); }

  .entry-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .entry.open .entry-body { display: block; }
  .field-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 12px 0 6px; }
  .price-row { display: flex; gap: 8px; align-items: center; }
  .price-row input { flex: 2; }
  .price-row select { flex: 1; }
  .price-tier { margin-bottom: 8px; }
  .tier-label { margin-bottom: 4px; }
  .tier-remove { flex: 0 0 auto !important; padding: 8px 10px !important; width: auto !important; }
  .tier-add { margin-bottom: 4px; font-size: 0.85rem; padding: 8px 12px; }

  .entry-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  .add-card { background: var(--card); border: 1.5px dashed var(--border); border-radius: 14px; padding: 16px; margin: 16px 0 24px; }
  .add-card h2 { font-size: 1rem; margin: 0 0 10px; }
  .add-card input, .add-card select { margin-bottom: 8px; }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag-check {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 0.82rem; cursor: pointer; background: var(--bg);
  }
  .tag-check input { width: auto; margin: 0; }
  .tag-badge {
    font-size: 0.7rem; font-weight: 600; color: var(--accent);
    background: #e8f1fb; padding: 2px 7px; border-radius: 999px; margin-left: 4px;
  }

  .footer-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border);
    padding: 12px 20px; display: flex; justify-content: center; gap: 10px; align-items: center;
  }
  #status { font-size: 0.85rem; color: var(--muted); }
  #status.ok { color: var(--accent2); }
  #status.err { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<header>
  <h1>3udget katalog</h1>
  <div class="sub" id="countSub">Henter…</div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Søg efter post…">
</div>

<main>
  <div id="list"></div>

  <div class="add-card">
    <h2>+ Tilføj ny post</h2>
    <input type="text" id="newName" placeholder="Navn (fx Husleje)">
    <select id="newCategory">
      <option value="fixedExpense">Fast udgift</option>
      <option value="income">Indtægt</option>
    </select>
    <div class="field-label">Beløb</div>
    <div id="newTiers"></div>
    <input type="text" id="newDomain" placeholder="Domæne til logo (valgfrit, fx tdc.dk)">
    <input type="text" id="newIcon" placeholder="SF Symbol-ikon (valgfrit, fx house.fill)">
    <label class="tag-check" style="margin-bottom: 8px; width: fit-content;">
      <input type="checkbox" id="newIsLoanLikely">
      Ofte et lån (fx bilydelse, boliglån)
    </label>
    <div class="field-label">Foreslås i "Kom hurtigt i gang"-guiden når svaret er…</div>
    <div class="tag-row" id="newTagRow"></div>
    <div class="entry-actions">
      <button class="btn btn-secondary" id="newSuggestBtn" onclick="suggestPrice(null)">✨ Slå værdi op med AI</button>
      <button class="btn btn-primary" onclick="addEntry()">Tilføj</button>
    </div>
  </div>
</main>

<div class="footer-bar">
  <span id="status"></span>
  <button class="btn btn-secondary" onclick="load()">Genindlæs</button>
  <button class="btn btn-primary" onclick="syncToGitHub()">Synkroniser igen</button>
</div>

<script>
let entries = [];
let openIndex = null;

// Kept in sync with server.py's VALID_QUICKSTART_TAGS.
const QUICKSTART_TAGS = [
  { id: 'job', label: 'Arbejde' },
  { id: 'rent', label: 'Til leje' },
  { id: 'own', label: 'Ejerbolig' },
  { id: 'car', label: 'Bil' },
  { id: 'always', label: 'Altid (typisk)' },
  { id: 'noJob', label: 'Indtægt uden arbejde' },
];

function tagCheckboxesHtml(prefix, activeTags) {
  const active = new Set(activeTags || []);
  return QUICKSTART_TAGS.map(t => `
    <label class="tag-check">
      <input type="checkbox" id="tag-${prefix}-${t.id}" ${active.has(t.id) ? 'checked' : ''}>
      ${t.label}
    </label>
  `).join('');
}

function readCheckedTags(prefix) {
  return QUICKSTART_TAGS
    .filter(t => document.getElementById(`tag-${prefix}-${t.id}`).checked)
    .map(t => t.id);
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = cls || '';
}

function logoUrl(domain) {
  return domain ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64` : '';
}

function cycleLabel(cycle) {
  if (cycle === 'yearly') return 'årligt';
  if (cycle === 'semiAnnual') return 'halvårligt';
  if (cycle === 'quarterly') return 'kvartalsvist';
  return 'månedligt';
}

// Draft price tiers per entry, keyed by String(index) or 'new' — lets someone add/remove tier
// rows client-side (e.g. building out børneydelse's age brackets) before saving. Cleared once the
// entry is saved so the next open re-derives from the server's copy.
let tierDrafts = {};

function getTierDraft(key, entry) {
  if (!(key in tierDrafts)) {
    if (entry && entry.priceOptions && entry.priceOptions.length > 1) {
      // Tier 0's own billingCycle is omitted from the JSON when it matches the entry's base cycle
      // (that's what makes it the base) — fall back to entry.billingCycle there specifically, since
      // an empty string there would otherwise land on "(samme som først)"'s own default of monthly.
      tierDrafts[key] = entry.priceOptions.map((o, idx) => ({
        label: o.label,
        price: o.price,
        billingCycle: o.billingCycle || (idx === 0 ? entry.billingCycle : ''),
      }));
    } else if (entry) {
      tierDrafts[key] = [{ label: '', price: entry.price, billingCycle: entry.billingCycle }];
    } else {
      tierDrafts[key] = [{ label: '', price: '', billingCycle: 'monthly' }];
    }
  }
  return tierDrafts[key];
}

function readTiersFromDom(key) {
  const draft = tierDrafts[key] || [];
  return draft.map((_, idx) => {
    const labelEl = document.getElementById(`tierLabel-${key}-${idx}`);
    const priceEl = document.getElementById(`tierPrice-${key}-${idx}`);
    const cycleEl = document.getElementById(`tierCycle-${key}-${idx}`);
    return {
      label: labelEl ? labelEl.value.trim() : '',
      price: priceEl ? parseFloat(priceEl.value) || 0 : 0,
      billingCycle: cycleEl ? cycleEl.value : '',
    };
  });
}

function addTier(key) {
  tierDrafts[key] = readTiersFromDom(key);
  tierDrafts[key].push({ label: '', price: 0, billingCycle: '' });
  if (key === 'new') renderNewTiers(); else render();
}

function removeTier(key, idx) {
  tierDrafts[key] = readTiersFromDom(key);
  tierDrafts[key].splice(idx, 1);
  if (key === 'new') renderNewTiers(); else render();
}

// idx 0 (the default/top price) must always pick its own cycle; later tiers can leave it blank
// to inherit tier 0's cycle instead — matches how the app treats a tier's nil billingCycle.
function cycleOptionsHtml(selected, allowInherit) {
  const opts = [
    ...(allowInherit ? [{ v: '', l: '(samme som først)' }] : []),
    { v: 'monthly', l: 'Månedligt' },
    { v: 'quarterly', l: 'Kvartalsvist' },
    { v: 'semiAnnual', l: 'Halvårligt' },
    { v: 'yearly', l: 'Årligt' },
  ];
  return opts.map(o => `<option value="${o.v}" ${o.v === (selected || '') ? 'selected' : ''}>${o.l}</option>`).join('');
}

function priceTiersHtml(key, tiers) {
  const multi = tiers.length > 1;
  const rows = tiers.map((t, idx) => `
    <div class="price-tier">
      ${multi ? `<input type="text" class="tier-label" id="tierLabel-${key}-${idx}" placeholder="Label (fx 0–2 år)" value="${escapeAttr(t.label || '')}">` : ''}
      <div class="price-row">
        <input type="number" id="tierPrice-${key}-${idx}" placeholder="Beløb (kr.)" value="${t.price || ''}">
        <select id="tierCycle-${key}-${idx}">${cycleOptionsHtml(t.billingCycle, idx > 0)}</select>
        ${multi ? `<button type="button" class="btn btn-danger tier-remove" onclick="removeTier('${key}', ${idx})">✕</button>` : ''}
      </div>
    </div>
  `).join('');
  return `${rows}<button type="button" class="btn btn-secondary tier-add" onclick="addTier('${key}')">+ Tilføj prismulighed${multi ? '' : ' (fx efter alder)'}</button>`;
}

function renderNewTiers() {
  document.getElementById('newTiers').innerHTML = priceTiersHtml('new', getTierDraft('new', null));
}

function categoryLabel(category) {
  return category === 'income' ? 'Indtægt' : 'Fast udgift';
}

async function load() {
  setStatus('Henter…');
  const res = await fetch('/api/budgetItems');
  const data = await res.json();
  entries = data.budgetItems;
  render();
  setStatus('');
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML = '';
  const filtered = entries
    .map((e, i) => ({ e, i }))
    .filter(({ e }) => !q || e.name.toLowerCase().includes(q))
    .sort((a, b) => a.e.name.localeCompare(b.e.name, 'da'));

  document.getElementById('countSub').textContent =
    entries.length + ' poster i kataloget' + (q ? ' · ' + filtered.length + ' matcher' : '');

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">Ingen poster fundet.</div>';
    return;
  }

  for (const { e, i } of filtered) {
    const card = document.createElement('div');
    card.className = 'entry' + (openIndex === i ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'entry-head';
    head.innerHTML = `
      ${e.domain ? `<img class="logo" src="${logoUrl(e.domain)}" alt="">` : '<div class="logo"></div>'}
      <div>
        <div class="entry-title">${escapeHtml(e.name)} <span class="badge ${e.category === 'income' ? 'badge-income' : 'badge-expense'}">${categoryLabel(e.category)}</span>${e.isLoanLikely ? '<span class="tag-badge">lån</span>' : ''}${(e.quickStartTags || []).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('')}</div>
        <div class="entry-sub">${e.price} kr. · ${cycleLabel(e.billingCycle)}${e.priceOptions && e.priceOptions.length > 1 ? ` · ${e.priceOptions.length} priser` : ''}${e.icon ? ' · ' + escapeHtml(e.icon) : ''}</div>
      </div>
      <div class="chevron">▶</div>
    `;
    head.onclick = () => { openIndex = openIndex === i ? null : i; render(); };

    const tierKey = String(i);
    const tiers = getTierDraft(tierKey, e);
    const body = document.createElement('div');
    body.className = 'entry-body';
    body.innerHTML = `
      <div class="field-label">Navn</div>
      <input type="text" id="name-${i}" value="${escapeAttr(e.name)}">
      <div class="field-label">Type</div>
      <select id="category-${i}">
        <option value="fixedExpense" ${e.category === 'fixedExpense' ? 'selected' : ''}>Fast udgift</option>
        <option value="income" ${e.category === 'income' ? 'selected' : ''}>Indtægt</option>
      </select>
      <div class="field-label">Beløb${tiers.length > 1 ? ' — første er standard' : ''}</div>
      ${priceTiersHtml(tierKey, tiers)}
      <div class="field-label">Domæne (til logo, valgfrit)</div>
      <input type="text" id="domain-${i}" value="${escapeAttr(e.domain || '')}">
      <div class="field-label">SF Symbol-ikon (valgfrit, bruges hvis intet domæne)</div>
      <input type="text" id="icon-${i}" value="${escapeAttr(e.icon || '')}">
      <label class="tag-check" style="margin-bottom: 8px; width: fit-content;">
        <input type="checkbox" id="isLoanLikely-${i}" ${e.isLoanLikely ? 'checked' : ''}>
        Ofte et lån (fx bilydelse, boliglån)
      </label>
      <div class="field-label">Foreslås i "Kom hurtigt i gang"-guiden når svaret er…</div>
      <div class="tag-row">${tagCheckboxesHtml(i, e.quickStartTags)}</div>
      <div class="entry-actions">
        <button class="btn btn-secondary" id="suggestBtn-${i}" onclick="suggestPrice(${i})">✨ Opdater værdi med AI</button>
      </div>
      <div class="entry-actions">
        <button class="btn btn-danger" onclick='deleteEntry(${i}, ${JSON.stringify(e.name)})'>Slet</button>
        <button class="btn btn-primary" onclick='saveEntry(${i}, ${JSON.stringify(e.name)})'>Gem ændring</button>
      </div>
    `;

    card.appendChild(head);
    card.appendChild(body);
    list.appendChild(card);
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}

async function mutate(url, method, body, busyMsg) {
  setStatus(busyMsg);
  try {
    const res = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!data.ok) {
      setStatus(data.error || 'Noget gik galt', 'err');
      return null;
    }
    entries = data.budgetItems;
    return data;
  } catch (e) {
    setStatus('Kunne ikke kontakte serveren: ' + e, 'err');
    return null;
  }
}

function syncMessage(localMsg, sync) {
  if (!sync) return localMsg;
  if (!sync.ok) return localMsg + ' Kunne ikke synkronisere til GitHub: ' + (sync.log || sync.step) + ' — prøv "Synkroniser igen".';
  return localMsg + (sync.changed ? ' Sendt til GitHub — live om et øjeblik.' : '');
}

async function saveEntry(i, originalName) {
  const key = String(i);
  const updated = {
    name: document.getElementById(`name-${i}`).value.trim(),
    category: document.getElementById(`category-${i}`).value,
    domain: document.getElementById(`domain-${i}`).value.trim(),
    icon: document.getElementById(`icon-${i}`).value.trim(),
    quickStartTags: readCheckedTags(i),
    priceOptions: readTiersFromDom(key),
    isLoanLikely: document.getElementById(`isLoanLikely-${i}`).checked,
  };
  const data = await mutate('/api/budgetItems/' + encodeURIComponent(originalName), 'PUT', updated, 'Gemmer…');
  if (!data) return;
  delete tierDrafts[key];
  setStatus(syncMessage('Gemt.', data.sync), data.sync && !data.sync.ok ? 'err' : 'ok');
  openIndex = null;
  render();
}

async function deleteEntry(i, name) {
  if (!confirm(`Slet "${name}"?`)) return;
  const data = await mutate('/api/budgetItems/' + encodeURIComponent(name), 'DELETE', null, 'Sletter…');
  if (!data) return;
  setStatus(syncMessage('Slettet.', data.sync), data.sync && !data.sync.ok ? 'err' : 'ok');
  openIndex = null;
  render();
}

async function addEntry() {
  const name = document.getElementById('newName').value.trim();
  const category = document.getElementById('newCategory').value;
  const domain = document.getElementById('newDomain').value.trim();
  const icon = document.getElementById('newIcon').value.trim();
  const quickStartTags = readCheckedTags('new');
  const priceOptions = readTiersFromDom('new');
  const isLoanLikely = document.getElementById('newIsLoanLikely').checked;
  if (!name) { setStatus('Posten skal have et navn', 'err'); return; }
  if (!priceOptions.length || priceOptions[0].price <= 0) { setStatus('Indsæt et beløb', 'err'); return; }
  const data = await mutate('/api/budgetItems', 'POST', { name, category, domain, icon, quickStartTags, priceOptions, isLoanLikely }, 'Tilføjer…');
  if (!data) return;
  document.getElementById('newIsLoanLikely').checked = false;
  document.getElementById('newName').value = '';
  document.getElementById('newDomain').value = '';
  document.getElementById('newIcon').value = '';
  document.getElementById('newTagRow').innerHTML = tagCheckboxesHtml('new', []);
  delete tierDrafts['new'];
  renderNewTiers();
  setStatus(syncMessage('Tilføjet.', data.sync), data.sync && !data.sync.ok ? 'err' : 'ok');
  render();
}

// i === null means the "+ Tilføj ny post" form; otherwise the row index being edited. Only ever
// touches tier 0 (the default price) — later tiers are for brackets the AI isn't asked about.
async function suggestPrice(i) {
  const key = i === null ? 'new' : String(i);
  const nameField = i === null ? 'newName' : `name-${i}`;
  const categoryField = i === null ? 'newCategory' : `category-${i}`;
  const btnId = i === null ? 'newSuggestBtn' : `suggestBtn-${i}`;
  const name = document.getElementById(nameField).value.trim();
  if (!name) { setStatus('Skriv et navn først', 'err'); return; }
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  btn.textContent = 'Slår op…';
  setStatus('Slår gennemsnitsværdi op for "' + name + '"…');
  try {
    const res = await fetch('/api/suggest-price', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (!data.ok) {
      setStatus('Fejl: ' + data.error, 'err');
      return;
    }
    const priceEl = document.getElementById(`tierPrice-${key}-0`);
    const cycleEl = document.getElementById(`tierCycle-${key}-0`);
    if (priceEl) priceEl.value = data.price;
    if (cycleEl) cycleEl.value = data.billingCycle;
    document.getElementById(categoryField).value = data.category;
    tierDrafts[key] = readTiersFromDom(key);
    setStatus('Værdi opdateret — tjek den før du gemmer.', 'ok');
  } catch (e) {
    setStatus('Kunne ikke kontakte AI: ' + e, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = i === null ? '✨ Slå værdi op med AI' : '✨ Opdater værdi med AI';
  }
}

async function syncToGitHub() {
  setStatus('Synkroniserer…');
  const res = await fetch('/api/sync', { method: 'POST' });
  const data = await res.json();
  if (!data.ok) {
    setStatus('Fejl: ' + (data.log || data.step), 'err');
    return;
  }
  setStatus(data.log, 'ok');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('newTagRow').innerHTML = tagCheckboxesHtml('new', []);
renderNewTiers();
load();

setInterval(() => {
  if (openIndex === null) load();
}, 8000);
</script>

</body>
</html>
